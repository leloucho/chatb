<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Cliente - ESIAD</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --card: #ffffff;
            --ink: #13233a;
            --muted: #54657d;
            --brand: #0f9d8a;
            --brand-dark: #0a7f70;
            --accent: #ff6f3d;
            --line: #dde5ef;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Trebuchet MS", "Gill Sans", "Segoe UI", sans-serif;
            background: radial-gradient(circle at 15% 15%, #d7eef3, transparent 45%),
                        radial-gradient(circle at 85% 5%, #ffe7d8, transparent 40%),
                        var(--bg);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 520px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: 0 18px 35px rgba(8, 35, 58, 0.1);
            overflow: hidden;
        }

        .head {
            padding: 24px;
            background: linear-gradient(135deg, #0f9d8a, #25b1a0);
            color: #fff;
        }

        .head h1 {
            margin: 0 0 6px;
            font-size: 1.5rem;
        }

        .head p {
            margin: 0;
            opacity: 0.92;
        }

        .body {
            padding: 24px;
        }

        .badge {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            background: #e9f8f6;
            color: #0a6a5e;
            font-size: 0.86rem;
            margin-bottom: 16px;
        }

        .row { margin-bottom: 14px; }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
            color: var(--ink);
        }

        input {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 10px;
            font-size: 1rem;
            padding: 12px;
            color: var(--ink);
        }

        input[readonly] {
            background: #f8fafc;
            color: #6a7d95;
        }

        .btn {
            margin-top: 8px;
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, var(--accent), #ff8a3d);
            cursor: pointer;
        }

        .btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .msg {
            margin-top: 16px;
            padding: 12px;
            border-radius: 10px;
            display: none;
        }

        .msg.error {
            background: #ffebeb;
            color: #9f2d2d;
        }

        .msg.ok {
            background: #eaf8ef;
            color: #1f6b39;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="head">
            <h1>Registro de Cliente</h1>
            <p>Completa este paso para iniciar tu pedido.</p>
        </div>
        <div class="body">
            <div class="badge">Primer acceso</div>
            <form id="registerForm">
                <div class="row">
                    <label for="dni">DNI</label>
                    <input id="dni" type="text" readonly>
                </div>
                <div class="row">
                    <label for="name">Nombre completo</label>
                    <input id="name" type="text" minlength="2" maxlength="100" placeholder="Ejemplo: Maria Torres" required>
                </div>
                <button id="submitBtn" class="btn" type="submit">Guardar y continuar</button>
            </form>
            <div id="error" class="msg error"></div>
            <div id="ok" class="msg ok"></div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        const errorBox = document.getElementById('error');
        const okBox = document.getElementById('ok');
        const submitBtn = document.getElementById('submitBtn');

        function showError(msg) {
            errorBox.textContent = msg;
            errorBox.style.display = 'block';
            okBox.style.display = 'none';
        }

        function showOk(msg) {
            okBox.textContent = msg;
            okBox.style.display = 'block';
            errorBox.style.display = 'none';
        }

        async function loadContext() {
            if (!token) {
                showError('Token inválido. Regresa a WhatsApp y solicita un nuevo enlace.');
                submitBtn.disabled = true;
                return;
            }

            try {
                const res = await fetch(`/api/web/customer-context?token=${encodeURIComponent(token)}`);
                const payload = await res.json();

                if (!res.ok || !payload.success) {
                    throw new Error(payload.message || 'No se pudo validar el enlace');
                }

                document.getElementById('dni').value = payload.data.customerDni || '';
                if (payload.data.customerName) {
                    document.getElementById('name').value = payload.data.customerName;
                }
            } catch (err) {
                showError(err.message || 'Error cargando datos del cliente');
                submitBtn.disabled = true;
            }
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            if (name.length < 2) {
                showError('Ingresa un nombre válido.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Procesando...';

            try {
                const res = await fetch('/api/web/customer-register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, name })
                });

                const payload = await res.json();

                if (!res.ok || !payload.success) {
                    throw new Error(payload.message || 'No se pudo completar el registro');
                }

                showOk('Registro completado. Redirigiendo al formulario de pedido...');
                setTimeout(() => {
                    window.location.href = payload.nextUrl;
                }, 1200);
            } catch (err) {
                showError(err.message || 'No se pudo completar el registro');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Guardar y continuar';
            }
        });

        loadContext();
    </script>
</body>
</html>
